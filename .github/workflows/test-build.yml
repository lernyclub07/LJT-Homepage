name: Test Jekyll Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Show publications page
        run: cat _site/publications/index.html
      - name: Show a publication page
        run: cat _site/publication/synlogic/index.html || true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
