name: Test Jekyll Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Show publications page text
        run: |
          echo "=== PUBLICATIONS PAGE ==="
          sed 's/<[^>]*>//g' _site/publications/index.html | grep -v '^\s*$' | head -80
          echo "=== SINGLE PUBLICATION PAGE ==="
          sed 's/<[^>]*>//g' _site/publication/synlogic.html | grep -v '^\s*$' | head -40
